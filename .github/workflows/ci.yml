# ============================================================
# Sentinel — CI Pipeline (Tests + Lint)
# Déclencheur : toute Pull Request vers main ou develop
# ============================================================
name: 🧪 CI — Tests & Lint

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test:
    name: Tests Django + Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-used-in-production-abc123
      HMAC_SECRET_KEY: ci-test-hmac-key-not-used-in-production-xyz789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: sentinel_test
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://sentinel:sentinel_ci_password@localhost:5432/sentinel_test
      EMAIL_HOST: localhost
      EMAIL_PORT: 1025
      EMAIL_USE_TLS: "False"
      DEFAULT_FROM_EMAIL: sentinel@bicec.cm

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements/*.txt

      - name: 📦 Install dependencies
        run: |
          pip install -r code/requirements/base.txt
          pip install -r code/requirements/dev.txt

      - name: 🔍 Lint avec Ruff
        run: |
          pip install ruff
          ruff check code/

      - name: 🧪 Lancer les tests Django
        working-directory: code
        run: |
          python manage.py migrate --noinput
          python manage.py test --verbosity=2

      - name: ✅ Vérifier les migrations (pas de migrations manquantes)
        working-directory: code
        run: python manage.py migrate --check
