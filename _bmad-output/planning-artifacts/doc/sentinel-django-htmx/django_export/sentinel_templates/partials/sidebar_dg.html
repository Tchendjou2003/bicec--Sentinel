{# Sidebar — Profil Direction Générale. Active item via variable `active_route` ("dashboard", "users"...) #}
<aside x-show="$store.sentinel.sidebarOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full opacity-0" x-transition:enter-end="translate-x-0 opacity-100" class="w-64 shrink-0 bg-sidebar text-sidebar-foreground border-r border-sidebar-border/50 flex flex-col" style="display:none">
  <div class="p-4 border-b border-sidebar-border/40">
    <div class="flex items-center gap-2.5">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-primary shadow-glow shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sidebar-primary-foreground"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-sidebar-foreground font-heading tracking-tight">SENTINEL</p>
        <p class="text-[10px] text-sidebar-foreground/60 truncate">BICEC • Direction Générale</p>
      </div>
    </div>
  </div>
  <nav class="flex-1 overflow-y-auto py-3 px-2">
    <p class="text-sidebar-foreground/50 text-[10px] uppercase tracking-wider px-3 mb-2">Pilotage</p>
    <ul class="space-y-0.5">
      <li>
        <a href="/dg/" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm transition-smooth hover:bg-sidebar-accent {% if active_route == 'dashboard' %}bg-sidebar-accent text-sidebar-primary font-medium border-l-2 border-sidebar-primary{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard Exécutif</span>
        </a>
      </li>
      <li>
        <a href="/dg/directions/" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm transition-smooth hover:bg-sidebar-accent {% if active_route == 'vue' %}bg-sidebar-accent text-sidebar-primary font-medium border-l-2 border-sidebar-primary{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
          <span>Vue par Direction</span>
        </a>
      </li>
      <li>
        <a href="/dg/rapports/" class="flex items-center gap-2.5 rounded-md px-3 py-2 text-sm transition-smooth hover:bg-sidebar-accent {% if active_route == 'rapports' %}bg-sidebar-accent text-sidebar-primary font-medium border-l-2 border-sidebar-primary{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Rapports & Exports</span>
        </a>
      </li>
    </ul>
  </nav>
  <div class="p-3 border-t border-sidebar-border/40">
    <p class="text-[10px] text-sidebar-foreground/40 text-center">© 2026 BICEC Sentinel</p>
  </div>
</aside>
