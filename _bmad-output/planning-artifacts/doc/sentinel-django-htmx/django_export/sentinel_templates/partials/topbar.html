{# Topbar — variables: title, subtitle (optionnel) #}
<header class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-border/60 glass px-4 shadow-xs">
  <button type="button" @click="$store.sentinel.toggleSidebar()" class="p-2 rounded-md text-muted-foreground hover:text-foreground hover:bg-muted transition-smooth" aria-label="Basculer la sidebar">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <div class="flex-1 min-w-0">
    <h1 class="text-base font-bold font-heading text-foreground truncate leading-tight">{{ title|default:"SENTINEL" }}</h1>
    {% if subtitle %}<p class="text-xs text-muted-foreground truncate">{{ subtitle }}</p>{% endif %}
  </div>

  <div class="hidden md:flex items-center gap-2">
    <div class="relative group">
      <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground transition-smooth group-focus-within:text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Rechercher (Ctrl+K)..." class="w-72 pl-9 h-9 text-sm rounded-md bg-muted/40 border border-transparent focus:bg-card focus:border-primary/30 focus:outline-none focus:ring-0 transition-smooth" />
      <kbd class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 hidden lg:inline-flex h-5 select-none items-center gap-1 rounded border bg-muted px-1.5 font-mono text-[10px] font-medium text-muted-foreground">⌘K</kbd>
    </div>
  </div>

  <button type="button" class="relative rounded-full p-2 hover:bg-muted transition-smooth" aria-label="Notifications">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-destructive ring-2 ring-card animate-pulse-slow"></span>
  </button>

  <div x-data="{ open: false }" class="relative">
    <button @click="open = !open" type="button" class="flex items-center gap-2.5 rounded-full border border-border/60 bg-card/60 pl-1 pr-2 py-1 hover:bg-muted/40 transition-smooth">
      <div class="h-8 w-8 rounded-full bg-gradient-primary flex items-center justify-center shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary-foreground"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="hidden lg:flex items-center gap-1">
        <div class="text-sm leading-tight text-left">
          <p class="font-semibold text-foreground text-xs">{{ request.user.get_short_name|default:"Admin" }}</p>
          <p class="text-[10px] text-muted-foreground">SENTINEL</p>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted-foreground"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </button>
    <div x-show="open" @click.outside="open = false" x-transition class="absolute right-0 mt-2 w-48 rounded-lg border bg-card shadow-premium-lg py-1 z-40" style="display:none">
      <a href="#" class="block px-3 py-2 text-sm hover:bg-muted">Mon profil</a>
      <a href="#" class="block px-3 py-2 text-sm hover:bg-muted">Paramètres</a>
      <hr class="my-1 border-border" />
      <a href="{% url 'logout' %}" class="block px-3 py-2 text-sm text-destructive hover:bg-destructive/10">Se déconnecter</a>
    </div>
  </div>
</header>
