# ============================================
# Sentinel — Docker Compose PROD (ADR-09)
# ============================================
# C'est le fichier par défaut (Sécurisé pour la Production).
# En développement local, Docker Compose fusionnera automatiquement
# ce fichier avec `docker-compose.override.yml`.

services:
  # ── PostgreSQL 16 ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "5432"

  # ── Django Application (Gunicorn gthread) ──
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sentinel_static:/app/staticfiles
      - sentinel_media:/app/media
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "8000:8000"  # Port exposé directement — TLS géré par l'infrastructure BICEC en amont
    command: gunicorn config.wsgi:application -c gunicorn.conf.py

  # ── Django-Q2 Worker (Scheduler nocturne) ──
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SKIP_COLLECTSTATIC: "1"
    command: python manage.py qcluster
    volumes:
      - sentinel_media:/app/media
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      db:
        condition: service_healthy

volumes:
  sentinel_pgdata:
  sentinel_static:
  sentinel_media:
