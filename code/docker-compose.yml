# ============================================
# Sentinel — Docker Compose (ADR-09)
# ============================================
# Docker Compose v2 natif — pas de directive 'version:' dépréciée

services:
  # ── PostgreSQL 16 ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  # ── Django Application (Gunicorn gthread) ──
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    expose:
      - "8000"

  # ── Django-Q2 Worker (Scheduler nocturne) ──
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python manage.py qcluster
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx Reverse Proxy (TLS-ready) ──
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      # - "443:443"  # Décommenter quand les certificats TLS seront montés
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      # - ./certs:/etc/nginx/certs:ro  # Certificats TLS IT BICEC
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
  media_files:
