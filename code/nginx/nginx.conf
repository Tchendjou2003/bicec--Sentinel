# Sentinel — Nginx Configuration (ADR-02)
# TLS-ready: décommenter les blocs SSL quand les certificats IT BICEC sont disponibles

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # -- Sécurité Headers --
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -- Limite upload (aligné FR15/NFR-SCA-01: 15 Mo) --
    client_max_body_size 15M;

    # -- Fichiers statiques (CSS, JS, Fonts) --
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # -- BLOC SÉCURITÉ MÉDIAS (ADR-02) --
    # Les preuves d'audit ne sont JAMAIS exposées directement via Nginx.
    # L'accès passe obligatoirement par Django (RBAC + audit trail).
    location /media/ {
        deny all;
        return 403;
    }

    # -- Proxy vers Django/Gunicorn --
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}

