# Sentinel — Nginx Configuration (ADR-02)
# TLS-ready: La structure de production est en place.

# Bloc 1 : Redirection HTTP -> HTTPS (NFR-SEC-01)
server {
    listen 80;
    server_name localhost; # TODO: Changer par sentinel.bicec.local en prod

    # Re-résolution DNS dynamique du conteneur `web` via le DNS embarqué Docker.
    # Empêche le 502/504 quand `web` est redémarré et obtient une nouvelle IP
    # (sinon nginx garde l'ancienne IP en cache à vie).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # En développement sans SSL, on sert l'application directement sur le port 80 (via 8080)
    # TODO: En production, décommentez la ligne ci-dessous pour forcer le HTTPS
    # return 301 https://$host$request_uri;

    # =========================================================
    # Configuration temporaire pour le HTTP local (Dev/Test)
    # A SUPPRIMER LORSQUE LE HTTPS EST ACTIF
    # =========================================================
    charset utf-8;
    client_max_body_size 6M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        deny all;
        return 403;
    }

    location / {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}

