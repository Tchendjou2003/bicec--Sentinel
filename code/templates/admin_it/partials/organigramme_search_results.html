{% if query|length > 1 %}
  {% if results %}
    <div class="max-h-80 overflow-y-auto p-2">
      <div class="px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-widest mb-1">
        Résultats de recherche
      </div>
      {% for dept in results %}
      <button type="button" hx-get="{% url 'auth:organigramme-list' %}?parent_id={{ dept.parent_id|default:'' }}" hx-target="#organigramme-content" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-orange-50 group transition-colors" @click="query = ''">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-bold text-gray-900 group-hover:text-sentinel-orange transition-colors">
              {{ dept.name }}
            </p>
            <p class="text-xs text-gray-500 mt-0.5 flex items-center gap-1">
              <span class="font-mono bg-gray-100 px-1 rounded">{{ dept.code }}</span>
              {% if dept.parent %}
                <span class="mx-1 text-gray-300">•</span>
                {% if dept.parent.parent %}
                  {{ dept.parent.parent.name }} › 
                {% endif %}
                {{ dept.parent.name }}
              {% endif %}
            </p>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-sentinel-orange opacity-0 group-hover:opacity-100 transition-opacity"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </div>
      </button>
      {% endfor %}
    </div>
  {% else %}
    <div class="p-8 text-center text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mx-auto mb-3 text-gray-300"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <p class="text-sm font-medium text-gray-900">Aucun résultat trouvé</p>
      <p class="text-xs mt-1">Essayez avec un autre nom ou code d'entité.</p>
    </div>
  {% endif %}
{% endif %}
