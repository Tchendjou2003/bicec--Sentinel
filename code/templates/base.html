{% load static %}
<!DOCTYPE html>
<html lang="fr" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sentinel — Plateforme de suivi des recommandations d'audit BICEC">
    <title>{% block title %}Sentinel{% endblock %}</title>

    <!-- Tailwind CSS compilé -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}?v=2">

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-background text-foreground font-sans antialiased min-h-screen flex flex-col" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    {% block body %}
    {% block main %}
    <main class="flex-grow w-full">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}
    {% endblock %}

    {# Toasts globaux (Alpine.js) #}
    <div x-data class="fixed bottom-4 right-4 space-y-2 pointer-events-none" style="z-index: 9999;">
        <template x-for="n in $store.sentinel.notifications" :key="n.id">
            <div x-transition class="rounded-lg border bg-card shadow-premium-lg px-4 py-3 text-sm font-medium pointer-events-auto" :class="{
                'border-success/30 text-success': n.type === 'success',
                'border-destructive/30 text-destructive': n.type === 'error',
                'border-info/30 text-info': n.type === 'info',
                'border-warning/30 text-warning': n.type === 'warning'
            }" x-text="n.msg"></div>
        </template>
    </div>

    <!-- Scripts: HTMX + Alpine.js (LOCAL) + Sentinel Helpers -->
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <script src="{% static 'js/sentinel.js' %}" defer></script>
    <script src="{% static 'js/alpine.min.js' %}" defer></script>

    <!-- Pont entre Django Messages et Alpine Toasts -->
    {% if messages %}
    <script>
        document.addEventListener('alpine:init', () => {
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    Alpine.store('sentinel').notify("{{ message|escapejs }}", 'error');
                {% elif message.tags == 'success' %}
                    Alpine.store('sentinel').notify("{{ message|escapejs }}", 'success');
                {% elif message.tags == 'warning' %}
                    Alpine.store('sentinel').notify("{{ message|escapejs }}", 'warning');
                {% else %}
                    Alpine.store('sentinel').notify("{{ message|escapejs }}", 'info');
                {% endif %}
            {% endfor %}
        });
    </script>
    {% endif %}

    {% block extra_js %}{% endblock %}
</body>

</html>
