{% load static %}
{% comment %}
Composant Bar Chart.js (barres empilees horizontales ou verticales)
Variables : chart_id (str, unique), chart_data_json (JSON {labels, datasets})
Chart.js doit etre charge avant via block extra_js.
Utiliser escapejs (pas safe) pour XSS prevention.
{% endcomment %}
<div class="relative">
  <canvas id="{{ chart_id }}" height="300" aria-label="Repartition par direction" role="img"></canvas>
</div>
<script>
(function () {
  var chartId = "{{ chart_id }}";
  var chartJson = "{{ chart_data_json|escapejs }}";
  var d = JSON.parse(chartJson);
  var canvas = document.getElementById(chartId);
  if (!canvas) { return; }
  new Chart(canvas, {
    type: "bar",
    data: { labels: d.labels, datasets: d.datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { stacked: true, beginAtZero: true, ticks: { precision: 0, font: { size: 11 } }, grid: { color: "rgba(0,0,0,0.04)" } }
      },
      plugins: {
        legend: {
          position: "bottom",
          labels: { boxWidth: 12, padding: 14, font: { size: 11 }, usePointStyle: true }
        },
        tooltip: {
          callbacks: {
            footer: function (items) {
              var sum = 0;
              items.forEach(function (item) { sum += item.parsed.y; });
              return "Total : " + sum;
            }
          }
        }
      },
      animation: { duration: 500 }
    }
  });
}());
</script>
