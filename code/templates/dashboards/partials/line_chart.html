{% comment %}
Composant Line Chart.js — flux mensuel (créées / clôturées / actives)
Variables : chart_id (str, unique), chart_data_json (JSON {labels, datasets})
Chart.js doit être chargé avant via block extra_js.
{% endcomment %}
<div class="relative">
  <canvas id="{{ chart_id }}" height="260" aria-label="Flux mensuel des recommandations" role="img"></canvas>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var chartId = "{{ chart_id }}";
  var chartJson = "{{ chart_data_json|escapejs }}";
  var d = JSON.parse(chartJson);
  var canvas = document.getElementById(chartId);
  if (!canvas) { return; }
  new Chart(canvas, {
    type: "line",
    data: { labels: d.labels, datasets: d.datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 11 }, maxTicksLimit: 6 }
        },
        y: {
          beginAtZero: true,
          ticks: { precision: 0, font: { size: 11 } },
          grid: { color: "rgba(0,0,0,0.04)" }
        }
      },
      plugins: {
        legend: {
          position: "bottom",
          labels: { boxWidth: 12, padding: 14, font: { size: 11 }, usePointStyle: true }
        },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              return " " + ctx.dataset.label + " : " + ctx.parsed.y;
            }
          }
        }
      },
      animation: { duration: 400 }
    }
  });
});
</script>
