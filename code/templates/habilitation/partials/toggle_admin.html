<button type="button"
        hx-post="{% url 'workflow:habilitation-toggle-admin' u.pk %}"
        hx-target="this"
        hx-swap="outerHTML"
        class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-sentinel-orange focus:ring-offset-2 {% if u.is_audit_admin %}bg-sentinel-orange{% else %}bg-gray-300{% endif %}"
        title="{% if u.is_audit_admin %}Révoquer la délégation{% else %}Accorder la délégation{% endif %}">
    <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform {% if u.is_audit_admin %}translate-x-6{% else %}translate-x-1{% endif %}"></span>
</button>
