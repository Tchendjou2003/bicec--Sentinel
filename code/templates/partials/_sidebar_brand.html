{% load static lucide %}
{# En-tête de marque partagé (DS graphite). Param : profile_label. #}
<div class="px-5 pt-5 pb-4 border-b border-graphite-border">
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="flex h-10 w-10 items-center justify-center shrink-0 rounded-full overflow-hidden bg-white/5 ring-1 ring-inset ring-white/10">
        <img src="{% static 'img/logo.jpeg' %}" alt="BICEC" class="h-full w-full object-cover">
      </div>
      <div class="min-w-0 leading-tight">
        <p class="text-sm font-extrabold text-graphite-fg-strong font-heading tracking-tight">SENTINEL</p>
        <p class="text-[10px] text-sentinel-orange font-semibold uppercase tracking-widest mt-0.5 truncate">{{ profile_label }}</p>
      </div>
    </div>
    {# Toggle — réduit la sidebar ; le hamburger de la topbar (visible uniquement sidebar fermée) la rouvre #}
    <button type="button" @click="$store.sentinel.toggleSidebar()" aria-label="Réduire le menu"
      class="shrink-0 rounded-md p-1.5 text-graphite-fg hover:bg-graphite-hover hover:text-graphite-fg-strong transition-colors">
      {% lucide "panel-left-close" size=16 %}
    </button>
  </div>
</div>
