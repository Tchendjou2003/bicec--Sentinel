{% load lucide %}
{# Pied de sidebar — partagé (DS graphite). #}
<div class="px-3 py-4 border-t border-graphite-border">
  <form method="post" action="{% url 'auth:logout' %}" class="mb-4">
    {% csrf_token %}
    <button type="submit" class="group flex w-full items-center gap-3 rounded-md px-3 py-2 text-[13px] font-medium text-graphite-fg hover:bg-graphite-hover hover:text-danger transition-colors duration-150">
      {% lucide "log-out" size=18 class="shrink-0 opacity-90 group-hover:text-danger" %}
      <span>Se déconnecter</span>
    </button>
  </form>
  <p class="text-[10px] text-graphite-section font-medium text-center tracking-wide">© 2026 BICEC Sentinel</p>
</div>
