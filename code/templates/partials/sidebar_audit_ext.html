{% load static %}
{# Sidebar — Profil Audit Externe. Active item via variable `active_route` ("dashboard", "users"...) #}
<aside x-show="$store.sentinel.sidebarOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full opacity-0" x-transition:enter-end="translate-x-0 opacity-100" class="fixed inset-y-0 left-0 z-50 lg:static w-72 shrink-0 bg-white shadow-[4px_0_24px_rgba(0,0,0,0.02)] border-r border-gray-100 flex flex-col z-10" style="display:none">
  <div class="p-6 border-b border-gray-100 flex items-center justify-center">
    <div class="flex items-center gap-3 w-full">
      <div class="flex h-12 w-12 items-center justify-center shrink-0 overflow-hidden rounded-xl bg-white shadow-sm border border-gray-100 p-1">
        <img src="{% static 'img/logo.jpeg' %}" alt="BICEC" class="h-full w-full object-contain">
      </div>
      <div class="min-w-0">
        <p class="text-lg font-extrabold text-gray-900 font-heading tracking-tight leading-tight">SENTINEL</p>
        <p class="text-xs text-sentinel-orange font-semibold truncate uppercase tracking-wider">BICEC • Audit Externe</p>
      </div>
    </div>
  </div>
  <nav class="flex-1 overflow-y-auto py-6 px-4">
    <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest px-2 mb-3 mt-6 first:mt-0">Consultation</p>
    <ul class="space-y-2">
      <li>
        <a href="/audit-ext/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium transition-all duration-300 {% if active_route == 'dashboard' %}bg-gradient-to-r from-sentinel-orange to-[#C9631A] text-white shadow-lg shadow-orange-500/30{% else %}text-gray-500 hover:bg-orange-50 hover:text-sentinel-orange hover:shadow-sm{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a href="/audit-ext/consultation/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium transition-all duration-300 {% if active_route == 'recommandations' %}bg-gradient-to-r from-sentinel-orange to-[#C9631A] text-white shadow-lg shadow-orange-500/30{% else %}text-gray-500 hover:bg-orange-50 hover:text-sentinel-orange hover:shadow-sm{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="m13.25 16.25 1.75 1.75"/></svg>
          <span>Recommandations</span>
        </a>
      </li>
      <li>
        <a href="/audit-ext/export/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium transition-all duration-300 {% if active_route == 'export' %}bg-gradient-to-r from-sentinel-orange to-[#C9631A] text-white shadow-lg shadow-orange-500/30{% else %}text-gray-500 hover:bg-orange-50 hover:text-sentinel-orange hover:shadow-sm{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
          <span>Export ZIP</span>
        </a>
      </li>
    </ul>
  </nav>
  <div class="p-4 border-t border-gray-100 bg-gray-50/50">
    <p class="text-[11px] text-gray-400 font-medium text-center">© 2026 BICEC Sentinel</p>
  </div>
</aside>
