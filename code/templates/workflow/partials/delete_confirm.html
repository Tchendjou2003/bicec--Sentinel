{# Micro-modale de confirmation de suppression (AC4, AC5) #}
{# Incluse dans la page liste — ce partial est autonome pour HTMX swap si nécessaire #}
<div x-data="{ deleteOpen: false, deleteUrl: '', deleteRef: '' }" @open-delete.window="deleteOpen = true; deleteUrl = $event.detail.url; deleteRef = $event.detail.ref">
  <div x-show="deleteOpen" x-transition class="fixed inset-0 z-[60] flex items-center justify-center" style="display:none">
    <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm" @click="deleteOpen = false"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md mx-4 animate-fade-in">
      <div class="flex items-center gap-3 mb-4">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-red-100">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-600"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </div>
        <div>
          <h3 class="text-lg font-semibold text-gray-900">Supprimer la recommandation</h3>
          <p class="text-sm text-gray-500">Réf. : <span x-text="deleteRef" class="font-medium text-gray-700"></span></p>
        </div>
      </div>
      <p class="text-sm text-gray-600 mb-6">Cette action est réversible (suppression logique). La recommandation ne sera plus visible dans le tableau.</p>
      <div class="flex justify-end gap-3">
        <button @click="deleteOpen = false" class="rounded-xl px-4 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">Annuler</button>
        <button @click="htmx.ajax('POST', deleteUrl, {swap:'none'}); deleteOpen = false" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 shadow-sm transition-colors">Confirmer la suppression</button>
      </div>
    </div>
  </div>
</div>
